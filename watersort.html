<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>워터 소트 퍼즐 (Water Sort Puzzle)</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* 가운데 정렬 */
            min-height: 100vh;
            margin: 0;
            padding: 2.5vh 15px; /* 세로 95% 범위를 위해 상하 2.5vh 패딩 */
            box-sizing: border-box;
            touch-action: none; 
            -webkit-user-select: none; 
            user-select: none;         
        }

        h1 {
            margin: 10px 0 5px 0;
            font-size: 1.8rem;
            color: #4dabf7;
        }

        .info {
            margin-bottom: 20px;
            font-size: 1rem;
            font-weight: bold;
            color: #4dabf7;
            text-align: center;
        }

        .game-container {
            display: grid;
            gap: 15px 8px;
            width: 100%;
            max-width: 540px;
            padding: 20px 10px;
            background: #2b2c34;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 25px;
            box-sizing: border-box;
        }

        .bottle {
            width: 100%;
            aspect-ratio: 1 / 3.2;
            margin: 0 auto;
            border: 2.5px solid #fff;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            border-top: none;
            display: flex;
            flex-direction: column-reverse; 
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
            -webkit-touch-callout: none; 
        }

        .bottle.selected {
            transform: translateY(-12px);
            box-shadow: 0 10px 15px rgba(77, 171, 247, 0.4);
            border-color: #4dabf7;
        }

        .bottle.completed {
            border-color: #51cf66;
            cursor: not-allowed;
            animation: pulse 1.5s infinite;
        }

        .water-block {
            width: 100%;
            height: 25%;
            transition: background-color 0.3s;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .button-group {
            display: flex;
            width: 100%;
            max-width: 540px;
            gap: 8px;
            align-items: center;
        }

        button, select {
            padding: 14px 5px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
            text-align: center;
            text-align-last: center;
        }

        button:active { transform: scale(0.95); }
        
        .btn-undo { flex: 1; background-color: #f59f00; }
        .btn-undo:hover { background-color: #f08c00; }
        .btn-undo:disabled { background-color: #555; cursor: not-allowed; opacity: 0.5; }

        .btn-reset { flex: 1; background-color: #868e96; }
        .btn-reset:hover { background-color: #495057; }
        
        .select-level { 
            flex: 1.5;
            background-color: #343a40; 
            border: 2px solid #495057;
            outline: none;
        }
        .select-level:focus { border-color: #4dabf7; }

        .btn-new { flex: 1.5; background-color: #4dabf7; }
        .btn-new:hover { background-color: #339af0; }

        .btn-stats { flex: 1; background-color: #6741d9; }
        .btn-stats:hover { background-color: #5f3dc4; }

        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            color: #fff;
            font-size: 0.85rem;
        }
        .stats-table th, .stats-table td {
            padding: 8px 4px;
            border-bottom: 1px solid #495057;
            text-align: center;
        }
        .stats-table th { background-color: #343a40; color: #4dabf7; }
        .stats-table tr:last-child td { border-bottom: none; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background-color: #2b2c34;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #51cf66;
            margin-bottom: 15px;
        }

        .modal-btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            font-size: 0.95rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(81, 207, 102, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(81, 207, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(81, 207, 102, 0); }
        }
    </style>
</head>
<body>

    <h1>Water Sort Puzzle</h1>
    <div class="info" id="gameInfo">게임 준비 중...</div>

    <div class="game-container" id="gameContainer"></div>

    <div class="button-group">
        <button class="btn-undo" id="undoBtn" onclick="undoMove()" disabled>취소</button>
        <button class="btn-reset" onclick="resetCurrentGame()">초기화</button>
        
        <select class="select-level" id="levelSelect" onchange="startNewGame()">
            <option value="6">6개</option>
            <option value="7">7개</option>
            <option value="8">8개</option>
            <option value="9">9개</option>
            <option value="10">10개</option>
            <option value="11">11개</option>
            <option value="12" selected>12개</option>
            <option value="13">13개</option>
            <option value="14">14개</option>
        </select>

        <button class="btn-new" onclick="startNewGame()">새 게임</button>
        <button class="btn-stats" onclick="showStatistics()">통계</button>
    </div>

    <div id="winModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">🎉 축하합니다!</div>
            <p style="color: #adb5bd; margin: 5px 0 15px 0;">모든 물병의 색상을 완벽하게 정렬하셨습니다!</p>
            <div id="winTimeInfo" style="color: #4dabf7; font-weight: bold; margin-bottom: 10px;"></div>
            <div class="modal-btn-group">
                <button class="btn-reset modal-btn" onclick="closeModal('winModal')">창 닫기</button>
                <button class="btn-new modal-btn" onclick="handleWinNewGame()">새 게임</button>
            </div>
        </div>
    </div>

    <div id="statsModal" class="modal">
        <div class="modal-content" style="max-width: 90%; width: 500px;">
            <div class="modal-title" style="color: #4dabf7;">📊 레벨별 통계</div>
            <div style="max-height: 300px; overflow-y: auto;">
                <table class="stats-table" id="statsTable">
                    <thead>
                        <tr>
                            <th>레벨</th>
                            <th>성공/실패</th>
                            <th>성공률</th>
                            <th>최소/평균 시간</th>
                        </tr>
                    </thead>
                    <tbody id="statsTableBody"></tbody>
                </table>
            </div>
            <div class="modal-btn-group">
                <button class="btn-reset modal-btn" onclick="closeModal('statsModal')">닫기</button>
                <button class="btn-undo modal-btn" onclick="resetStatistics()">통계 초기화</button>
            </div>
        </div>
    </div>

    <script>
        // #4682b4 색상을 밝은 연두색(#9acd32)으로 전격 수정 완료
        const COLORS = [
            '#da70d6', '#9acd32', '#ff3b30', '#ff9500', '#FFFF00', 
            '#008000', '#00FFFF', '#007aff', '#c6a176', '#5856d6',
            '#FFC0CB', '#808080'
        ];

        const WATER_PER_BOTTLE = 4;   
        
        let bottlesData = [];         
        let initialBottlesState = []; 
        let selectedBottleIndex = null; 
        let moveHistory = [];

        let totalBottles = 12;
        let filledBottles = 10;

        let gameStartTime = null;
        let isGameActive = false;
        let gameStats = {};

        function loadStats() {
            const saved = localStorage.getItem('waterSortStats');
            if (saved) {
                gameStats = JSON.parse(saved);
            }
        }

        function saveStats() {
            localStorage.setItem('waterSortStats', JSON.stringify(gameStats));
        }

        function recordFailure() {
            if (isGameActive) {
                const levelKey = `level_${totalBottles}`;
                if (!gameStats[levelKey]) {
                    gameStats[levelKey] = { success: 0, failure: 0, minTime: null, totalTime: 0 };
                }
                gameStats[levelKey].failure++;
                saveStats();
                isGameActive = false;
            }
        }

        function recordSuccess(timeSec) {
            const levelKey = `level_${totalBottles}`;
            if (!gameStats[levelKey]) {
                gameStats[levelKey] = { success: 0, failure: 0, minTime: null, totalTime: 0 };
            }
            gameStats[levelKey].success++;
            if (gameStats[levelKey].minTime === null || timeSec < gameStats[levelKey].minTime) {
                gameStats[levelKey].minTime = timeSec;
            }
            gameStats[levelKey].totalTime += timeSec;
            saveStats();
            isGameActive = false;
        }

        document.addEventListener('touchmove', function(e) {
            if (e.scale !== 1) return; 
            e.preventDefault();
        }, { passive: false });

        // 🧠 무한 루프 차단 및 시작 시 강제 완성 조건 방지용 데이터 생성 함수
        function generateSolvablePuzzle(total, filled) {
            let state = [];

            let colorPool = [];
            for (let i = 0; i < filled; i++) {
                for (let j = 0; j < WATER_PER_BOTTLE; j++) {
                    colorPool.push(COLORS[i]);
                }
            }

            let isFine = false;
            while (!isFine) {
                for (let i = colorPool.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [colorPool[i], colorPool[j]] = [colorPool[j], colorPool[i]];
                }

                state = [];
                isFine = true;
                for (let i = 0; i < filled; i++) {
                    let singleBottle = colorPool.slice(i * WATER_PER_BOTTLE, (i + 1) * WATER_PER_BOTTLE);
                    if (singleBottle.every(c => c === singleBottle[0])) {
                        isFine = false;
                        break;
                    }
                    state.push(singleBottle);
                }
            }

            // 마지막 무조건 2개 병 완전 비우기 처리 고정
            for (let i = 0; i < (total - filled); i++) {
                state.push([]);
            }

            return state;
        }

        function startNewGame() {
            recordFailure();

            selectedBottleIndex = null;
            moveHistory = []; 
            updateUndoButtonState();

            totalBottles = parseInt(document.getElementById('levelSelect').value);
            filledBottles = totalBottles - 2; 

            const infoText = document.getElementById('gameInfo');
            const container = document.getElementById('gameContainer');

            infoText.innerText = `현재 선택된 모드: ${totalBottles}개`;

            container.className = "game-container";
            const cols = Math.ceil(totalBottles / 2);
            container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

            bottlesData = generateSolvablePuzzle(totalBottles, filledBottles);
            initialBottlesState = JSON.parse(JSON.stringify(bottlesData));

            gameStartTime = Date.now();
            isGameActive = true;

            renderGame();
        }

        function resetCurrentGame() {
            selectedBottleIndex = null;
            moveHistory = []; 
            updateUndoButtonState();
            bottlesData = JSON.parse(JSON.stringify(initialBottlesState));
            renderGame();
        }

        function undoMove() {
            if (moveHistory.length === 0) return;
            selectedBottleIndex = null;
            bottlesData = moveHistory.pop();
            updateUndoButtonState();
            renderGame();
        }

        function updateUndoButtonState() {
            const undoBtn = document.getElementById('undoBtn');
            undoBtn.disabled = moveHistory.length === 0;
        }

        function renderGame() {
            const container = document.getElementById('gameContainer');
            container.innerHTML = '';

            let allCompleted = true;

            bottlesData.forEach((bottle, index) => {
                const bottleDiv = document.createElement('div');
                bottleDiv.classList.add('bottle');

                const cols = Math.ceil(totalBottles / 2);
                if (cols <= 4) bottleDiv.style.maxWidth = "60px";
                else if (cols <= 5) bottleDiv.style.maxWidth = "52px";
                else bottleDiv.style.maxWidth = "42px";

                const isCompleted = bottle.length === WATER_PER_BOTTLE && bottle.every(c => c === bottle[0]);
                
                if (isCompleted) {
                    bottleDiv.classList.add('completed');
                } else {
                    if (bottle.length > 0) {
                        allCompleted = false; 
                    }
                }

                if (index === selectedBottleIndex) {
                    bottleDiv.classList.add('selected');
                }

                bottle.forEach(color => {
                    const waterBlock = document.createElement('div');
                    waterBlock.classList.add('water-block');
                    waterBlock.style.backgroundColor = color;
                    bottleDiv.appendChild(waterBlock);
                });

                if (!isCompleted) {
                    bottleDiv.addEventListener('click', () => handleBottleClick(index));
                }

                container.appendChild(bottleDiv);
            });

            if (allCompleted) {
                triggerWinEffects();
            }
        }

        function handleBottleClick(index) {
            if (selectedBottleIndex === null) {
                if (bottlesData[index].length === 0) return; 
                selectedBottleIndex = index;
                renderGame();
            } else {
                const fromIdx = selectedBottleIndex;
                const toIdx = index;

                if (fromIdx === toIdx) {
                    selectedBottleIndex = null;
                    renderGame();
                    return;
                }

                if (canMoveWater(bottlesData, fromIdx, toIdx)) {
                    moveHistory.push(JSON.parse(JSON.stringify(bottlesData)));
                    updateUndoButtonState();

                    moveWater(bottlesData, fromIdx, toIdx);
                }

                selectedBottleIndex = null;
                renderGame();
            }
        }

        function canMoveWater(state, fromIdx, toIdx) {
            const fromBottle = state[fromIdx];
            const toBottle = state[toIdx];

            if (fromBottle.length === 0) return false; 
            if (toBottle.length >= WATER_PER_BOTTLE) return false; 
            if (toBottle.length === 0) return true; 

            const topColorFrom = fromBottle[fromBottle.length - 1];
            const topColorTo = toBottle[toBottle.length - 1];

            return topColorFrom === topColorTo; 
        }

        function moveWater(state, fromIdx, toIdx) {
            const fromBottle = state[fromIdx];
            const toBottle = state[toIdx];
            const targetColor = fromBottle[fromBottle.length - 1];

            while (fromBottle.length > 0 && toBottle.length < WATER_PER_BOTTLE) {
                if (fromBottle[fromBottle.length - 1] === targetColor) {
                    toBottle.push(fromBottle.pop());
                } else {
                    break;
                }
            }
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function triggerWinEffects() {
            if (isGameActive) {
                const endTime = Date.now();
                const timeTaken = Math.floor((endTime - gameStartTime) / 1000);
                recordSuccess(timeTaken);
                document.getElementById('winTimeInfo').innerText = `소요 시간: ${timeTaken}초`;
            }

            let duration = 3 * 1000;
            let end = Date.now() + duration;

            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 60, origin: { x: 0, y: 0.8 } });
                confetti({ particleCount: 5, angle: 120, spread: 60, origin: { x: 1, y: 0.8 } });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());

            setTimeout(() => {
                document.getElementById('winModal').style.display = 'flex';
            }, 800);
        }

        function handleWinNewGame() {
            closeModal('winModal');
            startNewGame();
        }

        function formatTime(sec) {
            if (sec === null) return '-';
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return m > 0 ? `${m}분 ${s}초` : `${s}초`;
        }

        function showStatistics() {
            const tbody = document.getElementById('statsTableBody');
            tbody.innerHTML = '';

            const levels = [];
            for (let i = 6; i <= 14; i++) levels.push(i);

            levels.forEach(lvl => {
                const key = `level_${lvl}`;
                const data = gameStats[key] || { success: 0, failure: 0, minTime: null, totalTime: 0 };
                const total = data.success + data.failure;
                const rate = total > 0 ? ((data.success / total) * 100).toFixed(1) + '%' : '-';
                const avg = data.success > 0 ? Math.floor(data.totalTime / data.success) : null;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${lvl}개</td>
                    <td>${data.success} / ${data.failure}</td>
                    <td>${rate}</td>
                    <td>${formatTime(data.minTime)} / ${formatTime(avg)}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('statsModal').style.display = 'flex';
        }

        function resetStatistics() {
            if (confirm('모든 통계 데이터를 초기화하시겠습니까?')) {
                gameStats = {};
                saveStats();
                showStatistics();
            }
        }

        loadStats();
        startNewGame();
    </script>
</body>
</html>
