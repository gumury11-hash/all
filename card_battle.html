<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카드 수식 대결</title>
    <style>
        :root {
            --bg-color: #f3f7fc;
            --card-bg: #ffffff;
            --primary-color: #3978d4;
            --accent-color: #e9a329;
            --danger-color: #dc4f5b;
            --text-color: #233247;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background: linear-gradient(180deg, #f8fbff 0%, var(--bg-color) 100%);
            color: var(--text-color);
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.5rem;
            color: #2d67b7;
            margin-bottom: 5px;
        }

        .status-board {
            display: flex;
            gap: 20px;
            background: #ffffff;
            padding: 10px 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #42536b;
            box-shadow: 0 5px 16px rgba(42, 74, 115, .08);
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .player-zone {
            background: rgba(255, 255, 255, .94);
            border: 1px solid #e1e9f2;
            border-radius: 16px;
            padding: 15px;
            position: relative;
            box-shadow: 0 8px 24px rgba(42, 74, 115, .07);
        }

        .player-zone.active {
            border-color: #7ba9e8;
            box-shadow: 0 0 0 3px rgba(57, 120, 212, .10), 0 8px 24px rgba(42, 74, 115, .08);
        }

        .player-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .hand-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            min-height: 90px;
            margin-bottom: 15px;
            padding: 8px;
            background: #f1f5fa;
            border-radius: 10px;
        }

        .slots-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 10px;
            background: #f5f8fc;
            border-radius: 12px;
        }

        .slot {
            width: 65px;
            height: 90px;
            border: 2px dashed #c5d1df;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #ffffff;
        }

        .slot.operator-slot {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }

        .slot.selected {
            border-color: var(--accent-color);
            background: rgba(245, 158, 11, 0.1);
        }

        .card {
            width: 60px;
            height: 85px;
            background: var(--card-bg);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5px;
            color: #1e293b;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(35, 50, 71, .16);
            transition: transform 0.15s;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .card.red {
            color: var(--danger-color);
        }

        .card.op-card {
            background: #38bdf8;
            color: #0f172a;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            height: 50px;
            width: 50px;
            border-radius: 50%;
        }

        .card.unary-card {
            background: #a855f7;
            color: white;
        }

        .attached-unary {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #a855f7;
            color: white;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 10px;
            border: 1px solid white;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            background: var(--primary-color);
            color: white;
            transition: opacity 0.2s;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .calc-preview {
            text-align: center;
            margin-top: 8px;
            font-size: 1.1rem;
            color: #2d67b7;
            min-height: 25px;
        }

        .deal-status { text-align: center; color: #64748b; }

        .deck-picker {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
            gap: 7px;
            padding: 10px;
            background: #f1f5fa;
            border-radius: 10px;
        }

        .deck-card-back {
            position: relative;
            overflow: hidden;
            min-height: 68px;
            padding: 4px;
            border: 3px solid #f8fafc;
            outline: 1px solid #cbd5e1;
            border-radius: 7px;
            background-color: #172554;
            background-image:
                repeating-linear-gradient(45deg, transparent 0 4px, rgba(255,255,255,.82) 4px 5px, transparent 5px 9px),
                repeating-linear-gradient(-45deg, transparent 0 4px, rgba(248,113,113,.9) 4px 5px, transparent 5px 9px),
                linear-gradient(135deg, #1e3a8a, #172554 48%, #1e40af);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 5px rgba(0,0,0,.3);
        }

        .deck-card-back::before {
            content: '';
            position: absolute;
            inset: 8px 5px;
            border: 1px solid #f8fafc;
            border-radius: 3px;
            box-shadow: inset 0 0 0 2px rgba(248,113,113,.85);
            pointer-events: none;
        }

        .deck-card-back::after {
            content: '✦';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 24px;
            height: 24px;
            display: grid;
            place-items: center;
            transform: translate(-50%, -50%) rotate(45deg);
            border: 2px double #f8fafc;
            border-radius: 50%;
            background: #991b1b;
            color: #fff;
            font-size: 15px;
            text-shadow: 0 0 3px #fca5a5;
            pointer-events: none;
        }

        .deck-card-back:hover { transform: translateY(-2px); }

        .result-overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(28, 43, 62, .48);
            backdrop-filter: blur(5px);
        }

        .result-overlay.visible { display: flex; }

        .result-dialog {
            width: min(100%, 420px);
            padding: 26px;
            border: 2px solid #f0c66e;
            border-radius: 16px;
            background: #ffffff;
            text-align: center;
            box-shadow: 0 18px 50px rgba(28, 43, 62, .24);
        }

        .result-dialog h2 { margin-bottom: 12px; color: #ad7412; }
        .result-dialog p { margin-bottom: 20px; line-height: 1.7; white-space: pre-line; }

        @media (max-width: 480px) and (orientation: portrait) {
            body {
                padding: 10px 10px calc(14px + env(safe-area-inset-bottom));
            }

            header { width: 100%; margin-bottom: 10px; }
            h1 { font-size: 1.25rem; margin-bottom: 9px; }

            .status-board {
                width: 100%;
                justify-content: space-between;
                gap: 6px;
                padding: 9px 10px;
                margin-bottom: 0;
                font-size: .8rem;
            }

            .game-container { gap: 10px; }
            .player-zone { padding: 11px 9px; border-radius: 14px; }
            .player-info { margin-bottom: 8px; font-size: .92rem; }
            .hand-container { gap: 6px; min-height: 78px; margin-bottom: 10px; padding: 6px; }
            .card { width: 52px; height: 74px; padding: 4px; font-size: .9rem; }

            .slots-container {
                gap: clamp(3px, 1.8vw, 7px);
                padding: 8px 4px;
            }

            .slot { width: clamp(44px, 15vw, 58px); height: clamp(64px, 21vw, 80px); }
            .slot.operator-slot, .card.op-card { width: clamp(36px, 11vw, 44px); height: clamp(36px, 11vw, 44px); }
            .calc-preview { margin-top: 6px; font-size: 1rem; }
            .deck-picker { grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; padding: 8px; }
            .deck-card-back { min-height: 58px; }
            button { min-height: 44px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>수식 마스터 1:1 트럼프 대결</h1>
        <div id="peer-share" style="display:none;margin:8px auto;color:#3978d4;font-size:.9rem;font-weight:700"></div>
        <div class="status-board">
            <div>라운드: <span id="round-num">1</span>/5</div>
            <div>플레이어 1 점수: <span id="p1-score">0</span></div>
            <div>AI 점수: <span id="p2-score">0</span></div>
        </div>
    </header>

    <div class="game-container">
        <!-- AI / Player 2 영역 -->
        <div class="player-zone" id="p2-zone">
            <div class="player-info">
                <h3>AI (상대방)</h3>
                <span id="p2-status">대기 중</span>
            </div>
            <div class="slots-container" id="p2-slots">
                <div class="slot num-slot"></div>
                <div class="slot operator-slot"></div>
                <div class="slot num-slot"></div>
                <div class="slot operator-slot"></div>
                <div class="slot num-slot"></div>
            </div>
            <div class="calc-preview" id="p2-preview">결과: -</div>
        </div>

        <!-- Player 1 영역 -->
        <div class="player-zone active" id="p1-zone">
            <div class="player-info">
                <h3>플레이어 1 (나)</h3>
                <span id="p1-status">카드배치 중</span>
            </div>
            <div class="deal-status" id="deal-status">숫자 카드 3장을 확인하고 보너스 카드를 뽑아주세요.</div>
            <div class="hand-container" id="p1-hand"></div>
            <div class="deck-picker" id="deck-picker"></div>
            <div class="slots-container" id="p1-slots">
                <div class="slot num-slot" data-index="0"></div>
                <div class="slot operator-slot" data-index="1"></div>
                <div class="slot num-slot" data-index="2"></div>
                <div class="slot operator-slot" data-index="3"></div>
                <div class="slot num-slot" data-index="4"></div>
            </div>
            <div class="calc-preview" id="p1-preview">수식을 완결해주세요</div>
        </div>

    </div>

    <div class="result-overlay" id="result-overlay" aria-hidden="true">
        <section class="result-dialog" role="dialog" aria-modal="true" aria-labelledby="result-title">
            <h2 id="result-title"></h2>
            <p id="result-detail"></p>
            <button id="result-action" onclick="confirmResult()">결과 확인</button>
        </section>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
    <script type="module">

        const battleParams = new URLSearchParams(window.location.search);
        const battleContext = {
            roomId: battleParams.get('roomId'),
            role: battleParams.get('role') === 'P2' ? 'P2' : 'P1',
            nickname: battleParams.get('nickname') || '',
            peerId: battleParams.get('peerId') || ''
        };
        let battlePeer = null;
        let battleConnection = null;
        let battleRoom = null;
        let battleSyncReady = false;
        let lastShownRound = 0;
        let advanceInProgress = false;

        const emptyBattleState = () => ({ round: 1, scores: { P1: 0, P2: 0 }, submissions: {}, ready: {}, resolvedRound: 0 });

        function applyBattleState(shared) {
            if (!shared || !battleSyncReady) return;
            currentRound = shared.round || 1;
            document.getElementById('round-num').textContent = currentRound;
            p1Score = shared.scores?.P1 || 0;
            p2Score = shared.scores?.P2 || 0;
            updateScoreBoard();

            const ownSubmission = shared.submissions?.[battleContext.role];
            const otherRole = battleContext.role === 'P1' ? 'P2' : 'P1';
            const otherSubmission = shared.submissions?.[otherRole];
            const displayScores = { ...(shared.scores || { P1: 0, P2: 0 }) };
            if (ownSubmission && otherSubmission && shared.resolvedRound !== currentRound) {
                const p1Value = shared.submissions.P1.value;
                const p2Value = shared.submissions.P2.value;
                if (p1Value > p2Value) displayScores.P1++;
                else if (p2Value > p1Value) displayScores.P2++;
            }
            p1Score = displayScores.P1;
            p2Score = displayScores.P2;
            updateScoreBoard();
            document.getElementById('p2-status').textContent = otherSubmission ? '제출 완료' : '수식 작성 중';
            document.getElementById('p2-preview').textContent = otherSubmission ? `상대 결과: ${otherSubmission.value}` : '상대 결과를 기다리는 중';

            if (ownSubmission) {
                turnResolved = true;
                document.getElementById('p1-status').textContent = '제출 완료';
                document.getElementById('p1-preview').textContent = `내 결과: ${ownSubmission.value}`;
                document.getElementById('deal-status').textContent = otherSubmission ? '두 플레이어가 제출했습니다.' : '제출 완료! 상대가 수식을 완성할 때까지 기다리는 중입니다.';
                document.getElementById('deck-picker').style.pointerEvents = 'none';
                document.getElementById('p1-hand').style.pointerEvents = 'none';
                document.getElementById('p1-slots').style.pointerEvents = 'none';
            }

            if (ownSubmission && otherSubmission && lastShownRound !== currentRound) {
                lastShownRound = currentRound;
                const myValue = ownSubmission.value;
                const otherValue = otherSubmission.value;
                const result = myValue > otherValue ? '승리' : myValue < otherValue ? '패배' : '무승부';
                const finalRound = currentRound === 5;
                document.getElementById('result-title').textContent = finalRound ? '5라운드 완료' : `${currentRound}라운드 결과: ${result}`;
                document.getElementById('result-detail').textContent = `내 결과: ${myValue} : 상대 결과: ${otherValue}\n현재 점수: ${p1Score} : ${p2Score}`;
                document.getElementById('result-action').textContent = finalRound ? '새 게임 시작' : (shared.ready?.[battleContext.role] ? '상대 확인 대기 중' : '다음 라운드');
                document.getElementById('result-action').disabled = !!shared.ready?.[battleContext.role];
                const overlay = document.getElementById('result-overlay');
                overlay.classList.add('visible');
                overlay.setAttribute('aria-hidden', 'false');
            }

            if (ownSubmission && otherSubmission && shared.ready?.[battleContext.role]) {
                document.getElementById('result-action').disabled = true;
                document.getElementById('result-action').textContent = '상대 확인 대기 중';
            }

            if (!ownSubmission && currentRound !== Number(document.getElementById('round-num').textContent)) {
                lastShownRound = 0;
                startRound();
            }

            if (shared.ready?.P1 && shared.ready?.P2) advanceSharedRoundIfReady();
        }

        async function initializeBattleSync() {
            if (!battleContext.roomId || !window.Peer) return false;
            battleRoom = { id: battleContext.roomId, cardBattle: emptyBattleState() };
            const connectAsHost = () => {
                battlePeer = new Peer(battleContext.peerId || undefined);
                battlePeer.on('open', id => {
                    battleContext.peerId = id;
                    const share = document.getElementById('peer-share');
                    share.textContent = `Peer ID ${id} — 상대에게 공유하세요.`;
                    share.style.display = 'block';
                    document.getElementById('deal-status').textContent = `Peer ID ${id} 를 상대에게 공유하세요.`;
                    battlePeer.on('connection', connection => {
                        battleConnection = connection;
                        connection.on('open', () => connection.send({ type: 'BATTLE_STATE', payload: battleRoom.cardBattle }));
                        connection.on('data', handleBattleMessage);
                    });
                    battleSyncReady = true;
                    applyBattleState(battleRoom.cardBattle);
                });
                battlePeer.on('error', error => {
                    console.error('PeerJS host setup failed:', error);
                    alert(`Peer 연결 준비 실패: ${error.type || error.message}`);
                });
            };
            if (battleContext.role === 'P1') {
                connectAsHost();
                return await new Promise(resolve => {
                    const timer = setInterval(() => {
                        if (battleSyncReady) { clearInterval(timer); resolve(true); }
                    }, 100);
                    setTimeout(() => { clearInterval(timer); resolve(false); }, 15000);
                });
            }
            let peerId = battleContext.peerId || prompt('방장 Peer ID를 입력하세요.');
            if (!peerId) return false;
            battlePeer = new Peer();
            return await new Promise(resolve => {
                let attempts = 0;
                const connect = () => {
                    if (attempts++ >= 20) { alert('방장 Peer에 연결하지 못했습니다. Peer ID를 확인하세요.'); resolve(false); return; }
                    const connection = battlePeer.connect(peerId, { reliable: true, metadata: { nickname: battleContext.nickname } });
                    connection.on('open', () => {
                        battleConnection = connection;
                        battleSyncReady = true;
                        connection.send({ type: 'JOIN' });
                        resolve(true);
                    });
                    connection.on('data', handleBattleMessage);
                    connection.on('error', () => setTimeout(connect, 700));
                    connection.on('close', () => { if (!battleSyncReady) setTimeout(connect, 700); });
                };
                battlePeer.on('open', connect);
                battlePeer.on('error', error => {
                    console.error('PeerJS client setup failed:', error);
                    if (error.type === 'peer-unavailable') setTimeout(connect, 700);
                    else resolve(false);
                });
            });
        }

        function handleBattleMessage(message) {
            if (!message) return;
            if (message.type === 'JOIN' && battleContext.role === 'P1') {
                battleConnection?.send({ type: 'BATTLE_STATE', payload: battleRoom.cardBattle });
            } else if (message.type === 'BATTLE_PATCH' && battleContext.role === 'P1') {
                applyBattlePatch(message.payload || {});
                battleConnection?.send({ type: 'BATTLE_STATE', payload: battleRoom.cardBattle });
                applyBattleState(battleRoom.cardBattle);
            } else if (message.type === 'BATTLE_STATE' && message.payload) {
                battleRoom.cardBattle = message.payload;
                applyBattleState(message.payload);
            }
        }

        function applyBattlePatch(patch) {
            const shared = { ...(battleRoom.cardBattle || emptyBattleState()) };
            for (const [key, value] of Object.entries(patch)) {
                const parts = key.split('.');
                let target = shared;
                for (const part of parts.slice(0, -1)) target = target[part] = { ...(target[part] || {}) };
                target[parts[parts.length - 1]] = value;
            }
            battleRoom.cardBattle = shared;
        }

        async function updateSharedBattle(patch) {
            if (!battleSyncReady || !battleConnection && battleContext.role === 'P2') throw new Error('Peer connection is not ready');
            if (battleContext.role === 'P1') {
                applyBattlePatch(patch);
                battleConnection?.send({ type: 'BATTLE_STATE', payload: battleRoom.cardBattle });
                applyBattleState(battleRoom.cardBattle);
            } else {
                battleConnection.send({ type: 'BATTLE_PATCH', payload: patch });
            }
        }
        async function advanceSharedRoundIfReady() {
            if (battleContext.role !== 'P1' || advanceInProgress) return;
            advanceInProgress = true;
            try {
                const shared = battleRoom?.cardBattle;
                if (shared?.submissions?.P1 && shared?.submissions?.P2 && shared.ready?.P1 && shared.ready?.P2) {
                    if (shared.round < 5) {
                        const scores = { ...(shared.scores || { P1: 0, P2: 0 }) };
                        if (shared.submissions.P1.value > shared.submissions.P2.value) scores.P1++;
                        else if (shared.submissions.P2.value > shared.submissions.P1.value) scores.P2++;
                        await updateSharedBattle({ 'round': shared.round + 1, 'scores': scores, 'submissions': {}, 'ready': {}, 'resolvedRound': shared.round });
                    } else await updateSharedBattle({ 'round': 1, 'scores': { P1: 0, P2: 0 }, 'submissions': {}, 'ready': {}, 'resolvedRound': 0 });
                }
            } catch (error) {
                console.error('Could not advance card battle round:', error);
            } finally {
                advanceInProgress = false;
            }
        }

        const SUITS = ['♠', '♥', '♦', '♣'];
        const OPERATORS = ['+', '-', '*', '/', '√', '^2'];
        
        let numDeck = [];
        let opDeck = [];
        let aiNumDeck = [];
        let aiOpDeck = [];
        let currentRound = 1;
        let p1Score = 0;
        let p2Score = 0;
        
        let p1Hand = [];
        let p2Hand = [];
        let p1Slots = [null, null, null, null, null];
        let p2Slots = [null, null, null, null, null];
        let selectedCard = null;
        let bonusDrawn = false;
        let pickPhase = 'number';
        let turnResolved = false;

        function createDecks() {
            numDeck = [];
            for (let suit of SUITS) {
                for (let val = 1; val <= 10; val++) {
                    numDeck.push({ type: 'num', suit, val, id: `${suit}_${val}` });
                }
            }
            opDeck = [];
            for (let op of OPERATORS) {
                for (let copy = 1; copy <= 5; copy++) {
                    opDeck.push({ type: 'op', val: op, id: `op_${op}_${copy}` });
                }
            }
            shuffle(numDeck);
            shuffle(opDeck);
            aiNumDeck = numDeck.map(card => ({ ...card }));
            aiOpDeck = opDeck.map(card => ({ ...card }));
            shuffle(aiNumDeck);
            shuffle(aiOpDeck);
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        function startNewMatch() {
            currentRound = 1;
            p1Score = 0;
            p2Score = 0;
            createDecks();
            updateScoreBoard();
            startRound();
        }

        function startRound() {
            if (currentRound > 5) {
                alert(`게임 종료! 최종 결과 - 플레이어: ${p1Score} vs AI: ${p2Score}`);
                return;
            }
            
            p1Slots = [null, null, null, null, null];
            p2Slots = [null, null, null, null, null];
            selectedCard = null;

            p1Hand = [];
            p2Hand = dealCards();
            bonusDrawn = false;
            pickPhase = 'number';
            turnResolved = false;
            document.getElementById('deck-picker').style.pointerEvents = 'auto';
            document.getElementById('p1-hand').style.pointerEvents = 'auto';
            document.getElementById('p1-slots').style.pointerEvents = 'auto';

            renderHand();
            renderDeckPicker();
            renderSlots();
            updatePreview();
            
            document.getElementById('round-num').textContent = currentRound;
            document.getElementById('p2-preview').textContent = "결과: -";
            document.getElementById('result-overlay').classList.remove('visible');
            document.getElementById('result-overlay').setAttribute('aria-hidden', 'true');
            document.getElementById('deal-status').textContent = `뒤집힌 숫자 카드 ${numDeck.length}장 중 3장을 선택하세요.`;
        }

        function renderDeckPicker() {
            const picker = document.getElementById('deck-picker');
            picker.innerHTML = '';
            if (pickPhase === 'arrange') {
                picker.style.display = 'none';
                return;
            }
            picker.style.display = 'grid';
            const deck = pickPhase === 'number' ? numDeck : opDeck;
            deck.forEach(card => {
                const back = document.createElement('button');
                back.type = 'button';
                back.className = 'deck-card-back';
                back.textContent = '';
                back.setAttribute('aria-label', '뒤집힌 카드 선택');
                back.onclick = () => selectDeckCard(card);
                picker.appendChild(back);
            });
        }

        function selectDeckCard(card) {
            if (pickPhase === 'number') {
                const index = numDeck.findIndex(item => item.id === card.id);
                if (index < 0 || p1Hand.filter(item => item.type === 'num').length >= 3) return;
                numDeck.splice(index, 1);
                p1Hand.push(card);
                const numberCount = p1Hand.filter(item => item.type === 'num').length;
                if (numberCount === 3) {
                    pickPhase = 'bonus';
                    document.getElementById('deal-status').textContent = `숫자 3장을 골랐습니다. 뒤집힌 보너스 카드 ${opDeck.length}장 중 2장을 선택하세요.`;
                } else {
                    document.getElementById('deal-status').textContent = `숫자 카드 ${numberCount}/3장 선택. 뒤집힌 카드 ${numDeck.length}장 남음.`;
                }
            } else if (pickPhase === 'bonus' || pickPhase === 'bonus-extra') {
                const index = opDeck.findIndex(item => item.id === card.id);
                if (index < 0) return;
                opDeck.splice(index, 1);
                p1Hand.push(card);
                const bonusCards = p1Hand.filter(item => item.type === 'op');
                const arithmeticCount = bonusCards.filter(item => ['+', '-', '/', '*'].includes(item.val)).length;
                if (arithmeticCount >= 2) {
                    finishCardPicking();
                } else {
                    pickPhase = bonusCards.length < 2 ? 'bonus' : 'bonus-extra';
                    document.getElementById('deal-status').textContent = `+ − ÷ × 카드 ${arithmeticCount}/2장입니다. 조건을 채울 때까지 보너스 카드를 계속 선택하세요. 뒤집힌 카드 ${opDeck.length}장 남음.`;
                }
            }
            renderHand();
            renderDeckPicker();
            updatePreview();
        }

        function finishCardPicking() {
            pickPhase = 'arrange';
            bonusDrawn = true;
            const numberCards = p1Hand
                .filter(card => card.type === 'num')
                .sort((a, b) => b.val - a.val);
            numberCards.forEach((card, index) => {
                p1Slots[index * 2] = { type: 'num', card, unary: null };
                removeFromHand(card);
            });
            renderSlots();
            document.getElementById('deal-status').textContent = '카드 선택이 끝났습니다. 수식에 카드를 배치하세요.';
        }

        function dealCards() {
            let hand = [];
            let unaryCount = 0;

            for (let i = 0; i < 3; i++) {
                if (aiNumDeck.length > 0) hand.push(aiNumDeck.pop());
            }

            for (let i = 0; i < 2; i++) {
                if (aiOpDeck.length > 0) {
                    let card = aiOpDeck.pop();
                    hand.push(card);
                    if (card.val === '√' || card.val === '^2') unaryCount++;
                }
            }

            while (unaryCount > 0 && aiOpDeck.length > 0) {
                hand.push(aiOpDeck.pop());
                unaryCount--;
            }

            return hand;
        }

        function renderHand() {
            const container = document.getElementById('p1-hand');
            container.innerHTML = '';
            
            p1Hand.forEach(card => {
                if (!card) return;
                const div = document.createElement('div');
                const isRed = card.suit === '♥' || card.suit === '♦';
                
                if (card.type === 'num') {
                    div.className = `card ${isRed ? 'red' : ''}`;
                    div.innerHTML = `<div>${card.val}</div><div style="font-size:1.2rem;text-align:center;">${card.suit}</div><div style="text-align:right;">${card.val}</div>`;
                } else {
                    const isUnary = card.val === '√' || card.val === '^2';
                    div.className = `card op-card ${isUnary ? 'unary-card' : ''}`;
                    div.textContent = card.val;
                }

                div.onclick = () => {
                    if (pickPhase === 'arrange') selectCard(card, div);
                };
                if (card.type === 'num') {
                    div.ondblclick = (event) => {
                        event.preventDefault();
                        if (pickPhase !== 'arrange') return;
                        selectedCard = card;
                        registerSelectedNumber();
                    };
                }
                container.appendChild(div);
            });
        }

        function selectCard(card, element) {
            document.querySelectorAll('#p1-hand .card').forEach(el => el.style.border = 'none');
            selectedCard = card;
            element.style.border = '2px solid #f59e0b';
        }

        function renderSlots() {
            const slots = document.querySelectorAll('#p1-slots .slot');
            slots.forEach((slot, idx) => {
                slot.onclick = () => placeInSlot(idx);
                slot.innerHTML = '';
                
                const item = p1Slots[idx];
                if (item) {
                    if (item.type === 'num') {
                        const isRed = item.card.suit === '♥' || item.card.suit === '♦';
                        let html = `<div class="card ${isRed ? 'red' : ''}" style="width:100%;height:100%;">
                            <div>${item.card.val}</div>
                            <div style="text-align:center;">${item.card.suit}</div>
                        </div>`;
                        if (item.unary) {
                            html += `<div class="attached-unary">${item.unary.val}</div>`;
                        }
                        slot.innerHTML = html;
                    } else if (item.type === 'op') {
                        slot.innerHTML = `<div class="card op-card" style="width:100%;height:100%;">${item.card.val}</div>`;
                    }
                }
            });
        }

        function placeInSlot(idx) {
            if (pickPhase !== 'arrange') return;
            if (!selectedCard) return;
            if (selectedCard.type === 'num') {
                registerSelectedNumber(idx);
                return;
            }

            const isNumSlot = idx % 2 === 0;

            if (selectedCard.type === 'num' && isNumSlot) {
                if (!p1Slots[idx]) {
                    p1Slots[idx] = { type: 'num', card: selectedCard, unary: null };
                    removeFromHand(selectedCard);
                }
            } else if (selectedCard.type === 'op') {
                const isUnary = selectedCard.val === '√' || selectedCard.val === '^2';
                if (isUnary && isNumSlot && p1Slots[idx]) {
                    p1Slots[idx].unary = selectedCard;
                    removeFromHand(selectedCard);
                } else if (!isUnary && !isNumSlot && !p1Slots[idx]) {
                    p1Slots[idx] = { type: 'op', card: selectedCard };
                    removeFromHand(selectedCard);
                }
            }

            selectedCard = null;
            renderHand();
            renderSlots();
            updatePreview();
        }

        function registerSelectedNumber(targetIdx = null) {
            if (pickPhase !== 'arrange') return;
            if (!selectedCard || selectedCard.type !== 'num') return;
            const idx = targetIdx === null ? [0, 2, 4].find(i => !p1Slots[i]) : targetIdx;
            if (idx === undefined || idx % 2 !== 0 || p1Slots[idx]) return;
            p1Slots[idx] = { type: 'num', card: selectedCard, unary: null };
            removeFromHand(selectedCard);
            selectedCard = null;
            renderHand();
            renderSlots();
            updatePreview();
        }

        function removeFromHand(card) {
            const idx = p1Hand.findIndex(c => c && c.id === card.id);
            if (idx !== -1) p1Hand.splice(idx, 1);
        }

        function resetCurrentSlots() {
            p1Slots.forEach(item => {
                if (item) {
                    if (item.card) p1Hand.push(item.card);
                    if (item.unary) p1Hand.push(item.unary);
                }
            });
            p1Slots = [null, null, null, null, null];
            selectedCard = null;
            renderHand();
            renderSlots();
            updatePreview();
        }

        function calculateExpression(slots) {
            if (slots.includes(null)) return null;

            let vals = [];
            for (let i = 0; i < 5; i += 2) {
                let v = slots[i].card.val;
                if (slots[i].unary) {
                    if (slots[i].unary.val === '√') v = Math.sqrt(v);
                    if (slots[i].unary.val === '^2') v = Math.pow(v, 2);
                }
                vals.push(v);
            }

            let op1 = slots[1].card.val;
            let op2 = slots[3].card.val;

            let res = 0;
            if ((op1 === '*' || op1 === '/') && (op2 === '+' || op2 === '-')) {
                let temp = evalStep(vals[0], op1, vals[1]);
                res = evalStep(temp, op2, vals[2]);
            } else if ((op2 === '*' || op2 === '/') && (op1 === '+' || op1 === '-')) {
                let temp = evalStep(vals[1], op2, vals[2]);
                res = evalStep(vals[0], op1, temp);
            } else {
                let temp = evalStep(vals[0], op1, vals[1]);
                res = evalStep(temp, op2, vals[2]);
            }

            return isFinite(res) ? Math.round(res * 100) / 100 : null;
        }

        function evalStep(a, op, b) {
            if (op === '+') return a + b;
            if (op === '-') return a - b;
            if (op === '*') return a * b;
            if (op === '/') return b !== 0 ? a / b : NaN;
            return 0;
        }

        function updatePreview() {
            const res = calculateExpression(p1Slots);
            const previewEl = document.getElementById('p1-preview');

            if (res !== null && bonusDrawn) {
                previewEl.textContent = `계산 결과: ${res}`;
                submitTurn();
            } else {
                previewEl.textContent = bonusDrawn ? "수식을 완성해주세요" : "보너스 카드를 먼저 선택해주세요";
            }
        }

        function submitTurn() {
            if (!bonusDrawn || turnResolved) return;
            const p1Res = calculateExpression(p1Slots);
            if (p1Res === null) return;
            turnResolved = true;
            if (battleContext.roomId && battleSyncReady) {
                const nums = p1Slots.filter((_, index) => index % 2 === 0).map(slot => slot.card.val);
                const ops = [p1Slots[1].card.val, p1Slots[3].card.val];
                const expression = `${nums[0]} ${ops[0]} ${nums[1]} ${ops[1]} ${nums[2]}`;
                document.getElementById('p1-status').textContent = '제출 완료';
                document.getElementById('deal-status').textContent = '제출 완료! 상대가 수식을 완성할 때까지 기다리는 중입니다.';
                document.getElementById('deck-picker').style.pointerEvents = 'none';
                updateSharedBattle({ [`submissions.${battleContext.role}`]: { value: p1Res, expression } })
                    .catch(error => {
                        turnResolved = false;
                        document.getElementById('deck-picker').style.pointerEvents = 'auto';
                        document.getElementById('deal-status').textContent = '제출에 실패했습니다. 네트워크 연결을 확인하고 다시 시도하세요.';
                        console.error('Card battle submission failed:', error);
                    });
                return;
            }
            const p2Res = runAI();

            document.getElementById('p2-preview').textContent = `계산 결과: ${p2Res}`;
            let result;
            if (p1Res > p2Res) {
                p1Score++;
                result = '승리';
            } else if (p2Res > p1Res) {
                p2Score++;
                result = '패배';
            } else {
                result = '무승부';
            }
            updateScoreBoard();

            const isFinalRound = currentRound === 5;
            document.getElementById('result-title').textContent = isFinalRound ? '5게임 완료' : `${currentRound}게임 결과: ${result}`;
            document.getElementById('result-detail').textContent = isFinalRound
                ? `이번 게임: 나 ${p1Res} : ${p2Res} AI (${result})\n최종 점수: 나 ${p1Score} : ${p2Score} AI`
                : `계산 결과 — 나 ${p1Res} : ${p2Res} AI\n현재 점수 — 나 ${p1Score} : ${p2Score} AI`;
            document.getElementById('result-action').textContent = isFinalRound ? '새 게임 시작' : '결과 확인';
            const overlay = document.getElementById('result-overlay');
            overlay.classList.add('visible');
            overlay.setAttribute('aria-hidden', 'false');
        }

        function confirmResult() {
            if (battleContext.roomId && battleSyncReady) {
                const shared = battleRoom?.cardBattle || emptyBattleState();
                if (shared.ready?.[battleContext.role]) return;
                document.getElementById('result-action').disabled = true;
                document.getElementById('result-action').textContent = '상대 확인 대기 중';
                updateSharedBattle({ [`ready.${battleContext.role}`]: true }).then(advanceSharedRoundIfReady).catch(error => {
                    document.getElementById('result-action').disabled = false;
                    console.error('Could not confirm card battle result:', error);
                });
                return;
            }
            if (currentRound === 5) {
                startNewMatch();
                return;
            }
            currentRound++;
            startRound();
        }

        function runAI() {
            let nums = p2Hand.filter(c => c.type === 'num');
            let ops = p2Hand.filter(c => c.type === 'op' && c.val !== '√' && c.val !== '^2');
            let unaries = p2Hand.filter(c => c.type === 'op' && (c.val === '√' || c.val === '^2'));

            if (nums.length < 3 || ops.length < 2) return 0;

            let dummySlots = [
                { type: 'num', card: nums[0], unary: unaries[0] || null },
                { type: 'op', card: ops[0] },
                { type: 'num', card: nums[1], unary: null },
                { type: 'op', card: ops[1] },
                { type: 'num', card: nums[2], unary: null }
            ];

            return calculateExpression(dummySlots) || 0;
        }

        function updateScoreBoard() {
            document.getElementById('p1-score').textContent = p1Score;
            document.getElementById('p2-score').textContent = p2Score;
        }

        window.confirmResult = confirmResult;

        async function startGame() {
            if (battleContext.roomId) {
                const connected = await initializeBattleSync();
                if (!connected) return;
                document.querySelector('#p2-zone h3').textContent = '상대 플레이어';
                document.querySelector('#p1-zone h3').textContent = `${battleContext.nickname || '나'} (${battleContext.role})`;
                document.querySelector('h1').textContent = '수식 카드 온라인 대전';
                document.querySelector('.status-board').children[1].childNodes[0].textContent = 'P1 점수: ';
                document.querySelector('.status-board').children[2].childNodes[0].textContent = 'P2 점수: ';
                document.getElementById('p2-status').textContent = '수식 작성 중';
            }
            startNewMatch();
            if (battleContext.roomId) applyBattleState(battleRoom.cardBattle || emptyBattleState());
        }

        startGame();
    </script>
